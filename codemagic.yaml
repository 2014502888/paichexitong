# Codemagic 编译配置 —— 寄递派车系统 iOS 版（ipa）
# 仓库：https://github.com/2014502888/paichexitong
# 用途：绕过 GitHub macOS runner 排队，改用 Codemagic 编译
# 触发：push 到 main / 网页手动 Build
workflows:
  build-ios:
    name: Build iOS (ipa)
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install xcodegen
        script: brew install xcodegen || true
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build for device (arm64, unsigned)
        script: |
          set -o pipefail
          xcodebuild build \
            -project gongzuozs.xcodeproj \
            -scheme gongzuozs \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build_log.txt
          echo "===== ERROR LINES ====="
          grep -E "error:" build_log.txt || echo "(no error: lines)"
          echo "======================="
      - name: Pack ipa (Payload structure)
        script: |
          set -e
          APP_PATH="build/dd/Build/Products/Release-iphoneos/gongzuozs.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/dd/Build/Products -name "gongzuozs.app" -type d | head -1)
            echo "Found at: $APP_PATH"
          fi
          rm -rf build/ipabuild
          mkdir -p build/ipabuild/Payload
          cp -R "$APP_PATH" build/ipabuild/Payload/
          cd build/ipabuild
          zip -qr ../../gongzuozs.ipa Payload
          cd ../..
          ls -la gongzuozs.ipa
    artifacts:
      - gongzuozs.ipa
      - build_log.txt
